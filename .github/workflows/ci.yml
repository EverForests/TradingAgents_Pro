name: CI

on:
  push:
    branches: [main, 'integration/course-project', 'v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request_review' }}

jobs:
  test:
    name: tests (py${{ matrix.python-version }}${{ matrix.tz && format(', {0}', matrix.tz) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # One run away from UTC, so a test that only passes in UTC fails here.
        include:
          - python-version: "3.12"
            tz: America/New_York
    env:
      TZ: ${{ matrix.tz }}
      NO_PROXY: 127.0.0.1,localhost
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run test suite
        run: |
          export no_proxy="$NO_PROXY"
          pytest -q tests test/offline

  course-artifacts:
    name: course schema, references and AI-use evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate course artifacts
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python -m pip install 'jsonschema>=4.23,<5' 'PyYAML>=6,<7'
          if [ -n "$PR_BASE" ]; then
            python .github/scripts/verify_course_artifacts.py "$PR_BASE"
          else
            python .github/scripts/verify_course_artifacts.py
          fi
      - name: Compare sentiment decisions with the pinned upstream
        env:
          LANGSMITH_TRACING: 'false'
        run: |
          python -m pip install -e '.[dev]'
          git worktree add --detach "$RUNNER_TEMP/fr03-baseline" 9fa1196fffbcfd9de5146d2dd2869df84ab99838
          FR03_BASELINE_ROOT="$RUNNER_TEMP/fr03-baseline" python -m pytest -q test/offline/test_fr03_paired.py

  smoke-install:
    name: clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fresh install (no dev extras) and import
        run: |
          python -m pip install --upgrade pip
          pip install .
          python -m pip check
          # Catches undeclared runtime deps (e.g. #994 python-dotenv): a bare
          # install must import the package and the CLI module.
          python -c "import tradingagents, cli.main; print('clean-install import OK')"

  lint:
    name: ruff (strict, full repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.16"
      - name: Lint the repository
        # The repo is fully clean under the strict select, so we lint everything
        # (generated results/ is excluded via pyproject extend-exclude).
        run: ruff check .

  d7-governance:
    name: D7 policy, types, security and semantic controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install development checks
        run: python -m pip install -e '.[dev]'
      - name: Select trusted-policy from comparison base
        env:
          COMPARE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python - <<'PY'
          import os, pathlib, re, subprocess
          base = os.environ.get('COMPARE_BASE', '')
          if not re.fullmatch('[0-9a-f]{40}', base) or base == '0' * 40:
              raise SystemExit('A real comparison base is required')
          dest = pathlib.Path('.d7-trusted')
          (dest / 'scripts').mkdir(parents=True, exist_ok=True)
          (dest / 'policy').mkdir(parents=True, exist_ok=True)
          names = subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', base], text=True).splitlines()
          policies = [p for p in names if p.startswith('.github/governance/') and p.endswith('.json')]
          scripts = [p for p in names if p.startswith('.github/scripts/d7_') and p.endswith('.py')]
          if not scripts:
              activation = '7da6ecc9ff665d096b3def5be9ee9601628ae05e'
              policy_revision = 'd7332d24cce9f1eee3eb329a1423d25b758973c0'
              subprocess.run(['git', 'merge-base', '--is-ancestor', base, activation], check=True)
              subprocess.run(['git', 'merge-base', '--is-ancestor', activation, 'HEAD'], check=True)
              subprocess.run(['git', 'merge-base', '--is-ancestor', policy_revision, 'HEAD'], check=True)
              changed = subprocess.check_output(['git', 'diff', '--name-only', activation, 'HEAD'], text=True).splitlines()
              allowed_roots = ('.github/', '.opencode/', 'docs/', 'test/governance/')
              allowed_files = {'README.md', 'Report.md', '.gitignore', 'mypy.ini', 'pyproject.toml'}
              if any(not (p.startswith(allowed_roots) or p in allowed_files) for p in changed):
                  raise SystemExit('Bootstrap is restricted to the approved governance and document scope')
              names = subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', policy_revision], text=True).splitlines()
              scripts = [p for p in names if p.startswith('.github/scripts/d7_') and p.endswith('.py')]
              policies = [p for p in names if p.startswith('.github/governance/') and p.endswith('.json')]
              for p in scripts + policies:
                  expected = subprocess.check_output(['git', 'show', policy_revision + ':' + p])
                  if pathlib.Path(p).read_bytes() != expected:
                      raise SystemExit('Bootstrap differs from the pinned reviewed governance snapshot: ' + p)
              base_policy_revision = policy_revision
          else:
              base_policy_revision = base
          for p in scripts + policies:
              body = subprocess.check_output(['git', 'show', base_policy_revision + ':' + p])
              target = dest / ('scripts' if p in scripts else 'policy') / pathlib.Path(p).name
              target.write_bytes(body)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('D7_BASE=' + base + '\n')
          PY
      - name: Verify policy, contracts, API, permissions and prior approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .d7-trusted/scripts/d7_policy.py --base "$D7_BASE" --policy-root .d7-trusted/policy
      - name: Type and security analysis against reviewed exact baselines
        run: python .d7-trusted/scripts/d7_static.py --policy-root .d7-trusted/policy
      - name: Run governance counterexamples
        run: python -m pytest -q test/governance --junitxml=.d7-receipts/governance.xml
      - name: Replay fixed semantic and five-control behavior checks
        env:
          LANGSMITH_TRACING: 'false'
        run: python .d7-trusted/scripts/d7_semantic.py --base "$D7_BASE" --policy-root .d7-trusted/policy
      - name: Retain sanitized gate receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: d7-governance-${{ github.run_id }}
          path: .d7-receipts/
          if-no-files-found: error

  d7-required:
    name: d7-required
    if: always()
    needs: [test, course-artifacts, smoke-install, lint, d7-governance]
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed unless every required gate succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          jobs = json.loads(os.environ['NEEDS_JSON'])
          required = {'test', 'course-artifacts', 'smoke-install', 'lint', 'd7-governance'}
          if set(jobs) != required or any(v['result'] != 'success' for v in jobs.values()):
              raise SystemExit('D7 blocks: failed, missing, skipped or cancelled required job')
          print('D7 required checks passed; hosted human approval remains independently required.')
          PY
