- path: tradingagents/agents/managers/portfolio_manager.py
  sha256: fd4e38a41bda40e5ff82942e12a51176d867bac1ab5c8bbe03f0e9b2bee30300
  source_snapshot: "\"\"\"Portfolio Manager: synthesises the risk-analyst debate into the final decision.\n\
    \nUses LangChain's ``with_structured_output`` so the LLM produces a typed\n``PortfolioDecision`` directly,\
    \ in a single call. FR-01 / INV-01: the manager\nwrites **only** the internal candidate (``candidate_decision``,\n\
    ``candidate_rating``, ``candidate_argument_ids``); the publication gate promotes\nit to the official\
    \ ``final_trade_decision`` / ``final_rating`` on approval, so a\nrefused candidate never reaches the\
    \ memory log, CLI display or saved reports.\nWhen a provider does not expose structured output, the\
    \ agent falls back to\nfree-text generation and the rating is read from that text — but with no\n\
    argument ids, so the gate blocks it.\n\nBoth decision paths meet before the node returns. There the\
    \ run's verified\nmetrics are re-read by ID with ``resolve_metric`` and passed on as\n``portfolio_verified_metrics``;\
    \ the model's text is never a source of numbers\nand no extra request is made.\n\"\"\"\n\nfrom __future__\
    \ import annotations\n\nfrom tradingagents.agents.context import (\n    get_instrument_context_from_state,\n\
    \    get_language_instruction,\n    get_portfolio_context_from_state,\n)\nfrom tradingagents.agents.rating\
    \ import parse_rating\nfrom tradingagents.agents.schemas import PortfolioDecision, render_pm_decision\n\
    from tradingagents.agents.structured import NO_EXTERNAL_TOOLS, bind_structured, invoke_structured\n\
    from tradingagents.agents.verified_metrics import resolve_metric\n\n\ndef _resolved_metrics(state)\
    \ -> list:\n    \"\"\"This run's verified metrics, re-read by ID, as {metric_id, result_value, result_unit}.\n\
    \n    A missing, null or wrong-typed course_run or registry yields an empty list,\n    as does a registry\
    \ whose records resolve to nothing (empty table, a prior\n    run's IDs, or an unknown ID). Order\
    \ follows the registry's own key order\n    and is the same on both decision paths. The passed state\
    \ is only read.\n    \"\"\"\n    run = state.get(\"course_run\") if isinstance(state, dict) else None\n\
    \    registry = state.get(\"verified_metrics\") if isinstance(state, dict) else None\n    if not isinstance(run,\
    \ dict) or not isinstance(registry, dict) or not registry:\n        return []\n    resolved = []\n\
    \    for metric_id in registry:\n        record = resolve_metric(metric_id, registry, run)\n     \
    \   if not isinstance(record, dict):\n            continue\n        if record.get(\"metric_id\") !=\
    \ metric_id:\n            continue\n        resolved.append({\n            \"metric_id\": metric_id,\n\
    \            \"result_value\": record.get(\"result_value\"),\n            \"result_unit\": record.get(\"\
    result_unit\"),\n        })\n    return resolved\n\n\ndef create_portfolio_manager(llm):\n    # Local\
    \ import preserves the graph/agents package initialization boundary.\n    from tradingagents.graph.publication_gate\
    \ import _resolve_selections, _select_aliases\n\n    structured_llm = bind_structured(llm, PortfolioDecision,\
    \ \"Portfolio Manager\")\n\n    def portfolio_manager_node(state) -> dict:\n        instrument_context\
    \ = get_instrument_context_from_state(state)\n        portfolio_context = get_portfolio_context_from_state(state)\n\
    \n        history = state[\"risk_debate_state\"][\"history\"]\n        risk_debate_state = state[\"\
    risk_debate_state\"]\n        research_plan = state[\"investment_plan\"]\n        trader_plan = state[\"\
    trader_investment_plan\"]\n\n        past_context = state.get(\"past_context\", \"\")\n        lessons_line\
    \ = (\n            f\"- Lessons from prior decisions and outcomes:\\n{past_context}\\n\"\n       \
    \     if past_context\n            else \"\"\n        )\n\n        # FR-01: the decision must rest\
    \ on arguments the program accepted. The\n        # accepted argument IDs are injected here so the\
    \ manager can cite them.\n        # FR-01 reference adapter: each listed line also offers a short\
    \ local\n        # selection ('= A1'), built from this same list and frozen for this\n        # invocation,\
    \ so the model need not copy a long run-bound ID.\n        accepted = state.get(\"accepted_arguments\"\
    ) or []\n        accepted_line = \"\"\n        argument_aliases: dict[str, str] = {}\n        if accepted:\n\
    \            argument_aliases = _select_aliases(\n                [a[\"argument_id\"] for a in accepted],\
    \ \"A\",\n            )\n            selections = {\n                reference: alias for alias, reference\
    \ in argument_aliases.items()\n            }\n            listed = \"\\n\".join(\n               \
    \ f\"- {a['argument_id']} ({a['speaker']}; evidence {', '.join(a['evidence_ids'])})\"\n          \
    \      + (f\" = {selections[a['argument_id']]}\"\n                   if a[\"argument_id\"] in selections\
    \ else \"\")\n                for a in accepted\n            )\n            accepted_line = (\n  \
    \              f\"\\n**Accepted arguments** (cite their short selections, such as 'A1', \"\n     \
    \           f\"in argument_ids; an exact full ID is also accepted):\\n{listed}\\n\"\n            )\n\
    \n        prompt = f\"\"\"As the Portfolio Manager, synthesize the risk analysts' debate and deliver\
    \ the final trading decision.\n\n{instrument_context}\n\n{portfolio_context}\n\n---\n\n**Rating Scale**\
    \ (use exactly one):\n- **Buy**: Strong conviction to enter or add to position\n- **Overweight**:\
    \ Favorable outlook, gradually increase exposure\n- **Hold**: Maintain current position, no action\
    \ needed\n- **Underweight**: Reduce exposure, take partial profits\n- **Sell**: Exit position or avoid\
    \ entry\n\n**Context:**\n- Research Manager's investment plan: **{research_plan}**\n- Trader's transaction\
    \ proposal: **{trader_plan}**\n{lessons_line}\n**Risk Analysts Debate History:**\n{history}\n{accepted_line}\n\
    \n---\n\nGround every conclusion in specific evidence from the analysts. The risk debate always contains\
    \ conflicting stances; deciding which is stronger is the job, so conflict alone is not a reason to\
    \ Hold. Commit to the stronger case, sized by how decisively it wins. Choose Hold only when the evidence\
    \ is still balanced after that weighing, or too thin to support a call; do not force a direction to\
    \ appear decisive. Weigh the analysts on their merits, independent of speaking order.\n\n## Output\n\
    \nWrite these sections, in this order, starting with the rating on its own line:\n\n- **Rating**:\
    \ exactly one of Buy / Overweight / Hold / Underweight / Sell\n- **Executive Summary**: the call and\
    \ how to act on it\n- **Investment Thesis**: the evidence that decided it, and what would change it\n\
    \n{NO_EXTERNAL_TOOLS}{get_language_instruction()}\"\"\"\n\n        # The typed rating is the decision;\
    \ the rendered text only carries it.\n        # Read back from text, a rating the thesis quotes could\
    \ replace it.\n        decision = invoke_structured(structured_llm, prompt, \"Portfolio Manager\"\
    )\n        if decision is not None:\n            candidate_body = render_pm_decision(decision)\n \
    \           candidate_rating = decision.rating.value\n            # FR-01 reference adapter: an A-selection\
    \ becomes the canonical\n            # accepted-argument ID the gate rechecks. An unknown or shortened\n\
    \            # selection is kept as written, so the gate refuses the candidate\n            # instead\
    \ of dropping the reference.\n            argument_ids = _resolve_selections(\n                decision.argument_ids\
    \ or [], argument_aliases, \"Portfolio Manager\",\n            )\n        else:\n            # FR-01:\
    \ no free-text rating fallback around the gate. A free-text\n            # answer carries no structured\
    \ argument_ids, so the candidate decision\n            # is kept but cannot publish — the gate blocks\
    \ it for lack of evidence.\n            candidate_body = llm.invoke(prompt).content\n            candidate_rating\
    \ = parse_rating(candidate_body)\n            argument_ids = []\n\n        # Both paths meet here:\
    \ re-read this run's verified metrics by ID.\n        portfolio_verified_metrics = _resolved_metrics(state)\n\
