- path: tradingagents/agents/researchers/bull_researcher.py
  sha256: 00e907de09e215650f594ffd5e5720573b478597837116e2e30ec9d302fc303e
  source_snapshot: "from tradingagents.agents.context import (\n    get_instrument_context_from_state,\n\
    \    get_language_instruction,\n    opponent_argument_or_opening,\n    report_or_absent,\n)\nfrom\
    \ tradingagents.agents.schemas import DebateArgument\nfrom tradingagents.agents.structured import\
    \ bind_structured, invoke_structured\n\n\ndef create_bull_researcher(llm):\n    # Imported here: ``publication_gate``\
    \ imports this package, so a module-level\n    # import of it here would be circular.\n    from tradingagents.graph.publication_gate\
    \ import (\n        _resolve_selections,\n        _select_aliases,\n        accepted_arguments_view,\n\
    \        as_index,\n        evidence_menu,\n        logger as reference_logger,\n        run_as_of_date,\n\
    \        validate_argument,\n    )\n\n    structured_llm = bind_structured(llm, DebateArgument, \"\
    Bull Researcher\")\n\n    def bull_node(state) -> dict:\n        investment_debate_state = state[\"\
    investment_debate_state\"]\n        history = investment_debate_state.get(\"history\", \"\")\n   \
    \     bull_history = investment_debate_state.get(\"bull_history\", \"\")\n\n        current_response\
    \ = opponent_argument_or_opening(\n            investment_debate_state.get(\"current_response\", \"\
    \"), \"bear analyst\"\n        )\n        market_research_report = report_or_absent(state[\"market_report\"\
    ], \"market\")\n        sentiment_report = report_or_absent(state[\"sentiment_report\"], \"sentiment\"\
    )\n        news_report = report_or_absent(state[\"news_report\"], \"news\")\n        fundamentals_report\
    \ = report_or_absent(state[\"fundamentals_report\"], \"fundamentals\")\n        instrument_context\
    \ = get_instrument_context_from_state(state)\n        asset_type = state.get(\"asset_type\", \"stock\"\
    )\n        target_label = \"stock\" if asset_type == \"stock\" else \"asset\"\n        fundamentals_label\
    \ = (\n            \"Company fundamentals report\"\n            if asset_type == \"stock\"\n     \
    \       else \"Asset fundamentals report (may be unavailable for crypto)\"\n        )\n        # FR-01:\
    \ give the model this run's evidence IDs and material together, so\n        # a cited ID resolves\
    \ to real run material.\n        evidence_state = state.get(\"evidence_index\")\n        aliases =\
    \ _select_aliases(as_index(evidence_state).evidence_ids, \"E\")\n        evidence_block = evidence_menu(evidence_state,\
    \ aliases)\n\n        prompt = f\"\"\"You are a Bull Analyst advocating for investing in the {target_label}.\
    \ Your task is to build a strong, evidence-based case emphasizing growth potential, competitive advantages,\
    \ and positive market indicators. Leverage the provided research and data to address concerns and\
    \ counter bearish arguments effectively.\n\nKey points to focus on:\n- Growth Potential: Highlight\
    \ the company's market opportunities, revenue projections, and scalability.\n- Competitive Advantages:\
    \ Emphasize factors like unique products, strong branding, or dominant market positioning.\n- Positive\
    \ Indicators: Use financial health, industry trends, and recent positive news as evidence.\n- Bear\
    \ Counterpoints: Critically analyze the bear argument with specific data and sound reasoning, addressing\
    \ concerns thoroughly and showing why the bull perspective holds stronger merit.\n- Engagement: Present\
    \ your argument in a conversational style, engaging directly with the bear analyst's points and debating\
    \ effectively rather than just listing data.\n\nResources available:\n{instrument_context}\nMarket\
    \ research report: {market_research_report}\nSocial media sentiment report: {sentiment_report}\nLatest\
    \ world affairs news: {news_report}\n{fundamentals_label}: {fundamentals_report}\nConversation history\
    \ of the debate: {history}\nLast bear argument: {current_response}\n\nAvailable evidence (cite these\
    \ exact IDs in evidence_ids; do not invent IDs):\n{evidence_block}\n\nEach evidence line ends with\
    \ a short selection such as '= E1'. Prefer the short selection in evidence_ids; an exact full ID is\
    \ also accepted. Never shorten or rewrite a full ID, and cite no selection that is not on this list.\n\
    \nUse this information to deliver a compelling bull argument, refute the bear's concerns, and engage\
    \ in a dynamic debate that demonstrates the strengths of the bull position.\n\"\"\" + get_language_instruction()\n\
    \n        # FR-01: prefer a structured argument so the evidence IDs are captured in\n        # the\
    \ same call; fall back to plain prose only for the debate text (that\n        # plain path carries\
    \ no evidence IDs, so it mints no argument and cannot\n        # back a published recommendation).\n\
    \        evidence_ids = ()\n        structured = invoke_structured(structured_llm, prompt, \"Bull\
    \ Researcher\")\n        if structured is not None:\n            # FR-01 reference adapter: an alias\
    \ selected from this invocation's\n            # menu becomes the canonical ID the validator checks.\
    \ An unknown or\n            # shortened selection is kept as written, so validation refuses the\n\
    \            # whole argument instead of dropping it.\n            evidence_ids = tuple(_resolve_selections(\n\
    \                structured.evidence_ids or (), aliases, \"Bull Researcher\",\n            ))\n  \
    \          content = structured.argument\n        else:\n            content = llm.invoke(prompt).content\n\
    \n        argument = f\"Bull Analyst: {content}\"\n\n        new_investment_debate_state = {\n   \
    \         \"history\": history + \"\\n\" + argument,\n            \"bull_history\": bull_history +\
    \ \"\\n\" + argument,\n            \"bear_history\": investment_debate_state.get(\"bear_history\"\
    , \"\"),\n            \"current_response\": argument,\n            \"count\": investment_debate_state[\"\
    count\"] + 1,\n        }\n\n        # FR-01: validate the cited evidence against this run's index\
    \ with the v1\n        # boundary ``validate_argument`` and, only if it is accepted, store the\n \
    \       # record it returns. That record keeps the run's full identity, so the\n        # gate can\
    \ re-check ownership. ``argument_index`` is the authoritative\n        # ID -> record mapping keyed\
    \ by ``argument_id`` (C1 v1.0);\n        # ``accepted_arguments`` is derived from it for legacy readers\
    \ and is\n        # never a release authority.\n        argument_index = dict(state.get(\"argument_index\"\
    ) or {})\n        evidence_state = state.get(\"evidence_index\")\n        if evidence_state is not\
    \ None and evidence_ids:\n            # Imported here: ``setup`` imports this module, so a module-level\n\
    \            # import of it would be circular.\n            from tradingagents.graph.setup import\
    \ _pending_run_context, _results_dir\n\n            run = state.get(\"course_run\") or _pending_run_context(state)\
    \ or {}\n            submission = {\n                \"contract_version\": \"1.0\",\n            \
    \    \"run_id\": run.get(\"run_id\", \"\"),\n                # The seeded RunContext is the identity\
    \ authority; fall back to the\n                # state only when an older checkpoint carries no context.\n\
    \                \"ticker\": run.get(\"ticker\") or state.get(\"company_of_interest\", \"\"),\n  \
    \              \"as_of_date\": run.get(\"as_of_date\") or run_as_of_date(state),\n               \
    \ \"argument_id\": f\"arg:bull:{run.get('run_id', '')}:\"\n                               f\"{new_investment_debate_state['count']}\"\
    ,\n                \"speaker\": \"Bull Analyst\",\n                \"claim\": argument,\n        \
    \        \"evidence_ids\": list(evidence_ids),\n            }\n            accepted = validate_argument(\n\
    \                submission, evidence_state, run, results_dir=_results_dir(),\n            )\n   \
    \         if accepted is None:\n                reference_logger.warning(\n                    \"\
    Argument rejected: actor=%s references=%r reason=UNRESOLVABLE_EVIDENCE\",\n                    \"\
    Bull Researcher\",\n                    [reference[:160] for reference in evidence_ids],\n       \
    \         )\n            else:\n                argument_id = accepted[\"argument_id\"]\n        \
    \        accepted = {**accepted, \"claim\": argument, \"speaker\": \"Bull Analyst\"}\n           \
    \     argument_index[argument_id] = accepted\n                # ``evidence_index`` is *not* rewritten\
    \ here. It is the\n                # authoritative mapping the Index Evidence step built, and a\n\
    \                # round-trip through ``index_to_state`` would drop each record's\n              \
    \  # identity and ``content_ref``, leaving the snapshot material\n                # unresolvable.\
    \ Accepting an argument appends to\n                # ``argument_index`` only; the gate reads both\
    \ mappings as stored.\n\n        return {\n            \"argument_index\": argument_index,\n     \
    \       \"investment_debate_state\": new_investment_debate_state,\n            \"pending_argument\"\
    : {\n                \"speaker\": \"Bull Analyst\",\n                \"text\": argument,\n       \
    \         \"evidence_ids\": list(evidence_ids),\n            },\n            \"accepted_arguments\"\
    : accepted_arguments_view(argument_index),\n        }\n\n    return bull_node\n"
